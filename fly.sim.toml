# Kindly API — simulation deployment.
#
# The public demo runs live against PayPal's sandbox. This second app is the
# no-credentials path: an in-process PayPal that implements the same trait,
# signs the same webhook deliveries, and lets a judge complete a payment without
# a PayPal account or a test card.
#
#   fly apps create kindly-desk-api-sim
#   fly volumes create kindly_sim_data --region sin --size 1 --app kindly-desk-api-sim
#   fly secrets set KINDLY_PORTAL_SECRET=... --app kindly-desk-api-sim
#   fly deploy --app kindly-desk-api-sim --config fly.sim.toml

app = "kindly-desk-api-sim"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  KINDLY_PAYPAL_MODE = "sim"
  KINDLY_SEED = "1"
  # The simulation is a story, so every boot starts it from today's dates.
  KINDLY_DEMO_MODE = "1"
  KINDLY_SCHEDULER = "1"
  KINDLY_DATA_DIR = "/data"
  KINDLY_OWNER_NAME = "Maya Rodriguez"
  KINDLY_OWNER_BUSINESS = "Maya Rodriguez Studio"
  KINDLY_PUBLIC_URL = "https://kindly-desk-sim.vercel.app"
  RUST_LOG = "info,kindly_server=info"

[[mounts]]
  source = "kindly_sim_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "20s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
