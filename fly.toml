# Kindly API on Fly.io — a small persistent volume, scaled to zero when idle.
#
#   fly apps create kindly-desk-api
#   fly volumes create kindly_data --region sin --size 1 --app kindly-desk-api
#   fly secrets set KINDLY_PORTAL_SECRET=... --app kindly-desk-api
#   fly deploy --app kindly-desk-api

app = "kindly-desk-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Live PayPal *sandbox* (test money). Credentials are Fly secrets, never here.
  KINDLY_PAYPAL_MODE = "live"
  # Ask for a real PayPal invoice; settle through Checkout when the app is not
  # granted the Invoicing feature.
  KINDLY_INVOICING = "auto"
  KINDLY_SEED = "1"
  KINDLY_SCHEDULER = "1"
  KINDLY_DATA_DIR = "/data"
  KINDLY_OWNER_NAME = "Maya Rodriguez"
  KINDLY_OWNER_BUSINESS = "Maya Rodriguez Studio"
  KINDLY_INVOICER_EMAIL = "sb-pm0gf53447938@business.example.com"
  # Portal links must open in the browser, so this is the WEB app's URL, not
  # this service's. Updated after the web deployment exists.
  KINDLY_PUBLIC_URL = "https://kindly-desk-web.vercel.app"
  RUST_LOG = "info,kindly_server=info"

[[mounts]]
  source = "kindly_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  # Scale to zero. A stopped machine costs nothing; Fly starts it on the next
  # request. The live instance does not reseed on boot, so a judge's state survives.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 100

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  # Generous: a cold boot seeds the studio and probes PayPal before serving.
  grace_period = "45s"
  method = "GET"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
