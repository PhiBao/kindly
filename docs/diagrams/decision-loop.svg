<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 600" width="1040" height="600" role="img" aria-labelledby="decision-loop-title decision-loop-desc">
  <title id="decision-loop-title">Kindly&#x27;s decision loop</title>
  <desc id="decision-loop-desc">A client message is understood, turned into one proposal, judged against the owner&#x27;s mandate, and then executed, queued for the owner, or blocked — with all three outcomes written to the ledger.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737a8a"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a32b1e"/>
    </marker>
    <marker id="arrow-settled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5b46"/>
    </marker>
  </defs>
  <rect width="1040" height="600" fill="#f7f2e8"/>
  <path d="M 240 184 L 280 184" fill="none" stroke="#737a8a" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 480 184 L 520 184" fill="none" stroke="#737a8a" stroke-width="1.3" marker-end="url(#arrow)"/><path d="M 720 184 L 760 184" fill="none" stroke="#a32b1e" stroke-width="1.3" marker-end="url(#arrow-accent)"/><path d="M 880 224 L 880 300" fill="none" stroke="#a32b1e" stroke-width="1.3" marker-end="url(#arrow-accent)"/><path d="M 880 376 L 880 392" fill="none" stroke="#737a8a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/><path d="M 880 472 L 880 484" fill="none" stroke="#a32b1e" stroke-width="1.3" marker-end="url(#arrow-accent)"/><path d="M 760 340 L 280 340" fill="none" stroke="#1d5b46" stroke-width="1.3" marker-end="url(#arrow-settled)"/><path d="M 760 432 L 280 432" fill="none" stroke="#737a8a" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/><path d="M 760 524 L 280 524" fill="none" stroke="#737a8a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="40" y="140" width="200" height="84" rx="6" fill="none" stroke="#c6b8a0" stroke-width="1.1" stroke-dasharray="5,4"/><rect x="40" y="140" width="44" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="280" y="140" width="200" height="84" rx="6" fill="#ffffff" stroke="#ddd3c0" stroke-width="1.1"/><rect x="280" y="140" width="92" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="520" y="140" width="200" height="84" rx="6" fill="#ffffff" stroke="#ddd3c0" stroke-width="1.1"/><rect x="520" y="140" width="56" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="760" y="140" width="240" height="84" rx="6" fill="#fdfaf3" stroke="#a32b1e" stroke-width="1.6"/><rect x="760" y="140" width="64" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="760" y="300" width="240" height="80" rx="6" fill="#fdfaf3" stroke="#ddd3c0" stroke-width="1.1"/><rect x="760" y="392" width="240" height="80" rx="6" fill="#fdfaf3" stroke="#ddd3c0" stroke-width="1.1"/><rect x="760" y="484" width="240" height="80" rx="6" fill="#fdfaf3" stroke="#ddd3c0" stroke-width="1.1"/><rect x="40" y="300" width="240" height="264" rx="6" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1.1"/><rect x="40" y="300" width="56" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/>
  <rect x="690.0" y="176" width="60.0" height="15" fill="#f7f2e8"/><rect x="859.0" y="256" width="42.0" height="15" fill="#f7f2e8"/><rect x="847.0" y="376" width="66.0" height="15" fill="#f7f2e8"/><rect x="859.0" y="472" width="42.0" height="15" fill="#f7f2e8"/><rect x="457.0" y="325" width="126.0" height="15" fill="#f7f2e8"/><rect x="463.0" y="417" width="114.0" height="15" fill="#f7f2e8"/><rect x="460.0" y="509" width="120.0" height="15" fill="#f7f2e8"/>
  <text x="40" y="46" font-family="Instrument Serif, Iowan Old Style, Georgia, serif" font-size="26" fill="#16181d">Who decides what the agent may do</text><text x="40" y="68" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="12" fill="#737a8a">The model proposes. The mandate disposes. Every verdict is recorded.</text><text x="47" y="151.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">INPUT</text><text x="56" y="170" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">A client replies</text><text x="56" y="186" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">letter or agent message</text><text x="287" y="151.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">MODEL + RULES</text><text x="296" y="170" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Understanding</text><text x="296" y="186" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">intent · injection scan</text><text x="527" y="151.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">PLANNER</text><text x="536" y="170" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Proposal</text><text x="536" y="186" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">one concrete action</text><text x="767" y="151.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">THE GATE</text><text x="776" y="170" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Policy engine</text><text x="776" y="186" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">your mandate, limit by limit</text><text x="776" y="324" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Allowed</text><text x="776" y="340" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">inside every limit</text><text x="776" y="416" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Waiting for you</text><text x="776" y="432" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">a limit would be crossed</text><text x="776" y="508" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Blocked</text><text x="776" y="524" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">refused, with the reason</text><text x="47" y="311.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">HISTORY</text><text x="56" y="330" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">The ledger</text><text x="56" y="346" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">append-only · shows</text><text x="56" y="359" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">all three outcomes</text><text x="56" y="372" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a"></text><text x="56" y="385" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">the owner can read</text><text x="56" y="398" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">every verdict later</text><text x="720" y="187" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#a32b1e">EVALUATE</text><text x="880" y="267" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#a32b1e">ALLOW</text><text x="880" y="387" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">NEEDS YOU</text><text x="880" y="483" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#a32b1e">BLOCK</text><text x="520" y="336" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#1d5b46">EXECUTED · RECORDED</text><text x="520" y="428" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">QUEUED · RECORDED</text><text x="520" y="520" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">REFUSED · RECORDED</text><text x="40" y="592" font-family="Instrument Serif, Iowan Old Style, Georgia, serif" font-style="italic" font-size="15" fill="#454b59">Instruction attempts from clients land here too — read as data, never obeyed.</text>
</svg>
