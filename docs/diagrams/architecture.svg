  <rect x="40" y="120" width="240" height="88" rx="6" fill="none" stroke="#c6b8a0" stroke-width="1.1" stroke-dasharray="5,4"/><rect x="40" y="120" width="56" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="40" y="248" width="240" height="88" rx="6" fill="none" stroke="#c6b8a0" stroke-width="1.1" stroke-dasharray="5,4"/><rect x="40" y="248" width="48" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="328" y="120" width="300" height="220" rx="6" fill="#ffffff" stroke="#ddd3c0" stroke-width="1.1"/><rect x="328" y="120" width="40" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="700" y="120" width="300" height="96" rx="6" fill="#fdfaf3" stroke="#a32b1e" stroke-width="1.6"/><rect x="700" y="120" width="92" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="700" y="248" width="300" height="88" rx="6" fill="#ffffff" stroke="#ddd3c0" stroke-width="1.1"/><rect x="700" y="248" width="92" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="40" y="400" width="240" height="96" rx="6" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1.1"/><rect x="40" y="400" width="48" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="328" y="400" width="300" height="96" rx="6" fill="none" stroke="#c6b8a0" stroke-width="1.1" stroke-dasharray="5,4"/><rect x="328" y="400" width="40" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/><rect x="700" y="400" width="300" height="96" rx="6" fill="none" stroke="#c6b8a0" stroke-width="1.1" stroke-dasharray="5,4"/><rect x="700" y="400" width="64" height="16" rx="2" fill="#efe6d4" stroke="#ddd3c0" stroke-width="1"/>
  <rect x="262.0" y="148" width="36.0" height="15" fill="#f7f2e8"/><rect x="313.0" y="184" width="30.0" height="15" fill="#f7f2e8"/><rect x="265.0" y="288" width="30.0" height="15" fill="#f7f2e8"/><rect x="634.0" y="141" width="60.0" height="15" fill="#f7f2e8"/><rect x="646.0" y="281" width="36.0" height="15" fill="#f7f2e8"/><rect x="818.0" y="224" width="60.0" height="15" fill="#f7f2e8"/><rect x="417.0" y="360" width="30.0" height="15" fill="#f7f2e8"/><rect x="530.0" y="360" width="60.0" height="15" fill="#f7f2e8"/><rect x="818.0" y="360" width="60.0" height="15" fill="#f7f2e8"/><rect x="136.0" y="352" width="48.0" height="15" fill="#f7f2e8"/>
  <text x="40" y="46" font-family="Instrument Serif, Iowan Old Style, Georgia, serif" font-size="26" fill="#16181d">What runs where</text><text x="40" y="68" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="12" fill="#737a8a">One Rust server, two surfaces, and PayPal on both the way out and the way back.</text><text x="47" y="131.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">BROWSER</text><text x="56" y="150" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Owner&#x27;s desk</text><text x="56" y="166" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">agent trail · approvals</text><text x="56" y="179" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">mandate · money view</text><text x="47" y="259.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">PUBLIC</text><text x="56" y="278" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Client portal</text><text x="56" y="294" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">signed, expiring link</text><text x="56" y="307" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">pay · propose a plan</text><text x="335" y="131.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">RUST</text><text x="344" y="150" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Kindly server</text><text x="344" y="166" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">axum · tokio · sqlx</text><text x="344" y="179" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">api · sse · scheduler</text><text x="344" y="192" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">webhook intake</text><text x="707" y="131.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">DETERMINISTIC</text><text x="716" y="150" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Policy engine</text><text x="716" y="166" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">your mandate, limit by limit</text><text x="716" y="179" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">allow · ask · block</text><text x="707" y="259.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">PROPOSES ONLY</text><text x="716" y="278" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Agent layer</text><text x="716" y="294" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">planner · composer</text><text x="716" y="307" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">reply understanding</text><text x="47" y="411.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">SQLITE</text><text x="56" y="430" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Ledger</text><text x="56" y="446" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">append-only audit</text><text x="56" y="459" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">invoices · actions · events</text><text x="335" y="411.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">REST</text><text x="344" y="430" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">PayPal APIs</text><text x="344" y="446" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">invoicing v2 · orders</text><text x="344" y="459" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">captures · reminders</text><text x="707" y="411.5" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9" letter-spacing="1.1" fill="#737a8a">OPTIONAL</text><text x="716" y="430" font-family="Inter Tight, Inter, -apple-system, system-ui, sans-serif" font-size="14.5" font-weight="600" fill="#16181d">Language model</text><text x="716" y="446" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#737a8a">compose · understand terms</text><text x="280" y="159" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">HTTP</text><text x="328" y="195" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#454b59">SSE</text><text x="280" y="299" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">PAY</text><text x="664" y="152" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#a32b1e">EVALUATE</text><text x="664" y="292" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">PLAN</text><text x="848" y="235" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">PROPOSES</text><text x="432" y="371" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">ACT</text><text x="560" y="371" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#1d5b46">DELIVERS</text><text x="848" y="371" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">COMPOSES</text><text x="160" y="363" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">APPEND</text><text x="40" y="556" font-family="Instrument Serif, Iowan Old Style, Georgia, serif" font-style="italic" font-size="15" fill="#454b59">PayPal is the only way money moves, and the only writer of payment records Kindly trusts.</text><text x="40" y="600" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="9.5" letter-spacing="0.8" fill="#737a8a">SOLID = REQUEST PATH · DASHED = ASYNCHRONOUS OR OPTIONAL · GREEN = MONEY MOVED</text>
</svg>
