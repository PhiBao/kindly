<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">Kindly architecture</title>
  <desc id="architecture-desc">Two surfaces over a Rust server: the policy engine gates every action, PayPal is called through Invoicing and Orders APIs, and webhook deliveries return verified payments into an append-only ledger.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737a8a"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a32b1e"/>
    </marker>
    <marker id="arrow-settled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d5b46"/>
    </marker>
  </defs>
  <rect width="1040" height="640" fill="#f7f2e8"/>
