<!doctype html>
<!-- Kindly close card: same paper, same stamp. -->
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1920px;height:1080px;overflow:hidden}
body{background:{{bg}};font-family:'DejaVu Sans',system-ui,sans-serif;color:{{ink}};
  background-image:radial-gradient(rgba(25,23,19,.06) 1px, transparent 1px);
  background-size:22px 22px}
.wrap{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  padding:96px 150px}
.mark{position:absolute;top:70px;left:150px;width:66px;height:66px;border:3px solid {{accent1}};
  color:{{accent1}};display:flex;align-items:center;justify-content:center;
  font-family:'DejaVu Serif',Georgia,serif;font-size:40px;font-weight:700;transform:rotate(-3deg);
  opacity:0;animation:stamp .5s cubic-bezier(.2,.9,.3,1.2) .1s both}
@keyframes stamp{from{opacity:0;transform:rotate(-9deg) scale(.9)}to{opacity:1;transform:rotate(-3deg) scale(1)}}
@keyframes slide{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.kicker{margin-top:60px;font-size:21px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:{{accent1}};opacity:0;animation:slide .6s ease .12s both}
h1{font-family:'DejaVu Serif',Georgia,serif;font-size:78px;line-height:1.12;margin:20px 0 0;
  letter-spacing:-.03em;font-weight:700;max-width:1480px;
  opacity:0;animation:slide .8s cubic-bezier(.16,1,.3,1) .2s both}
.big{font-size:44px;line-height:1.45;margin-top:26px;max-width:1360px;color:{{muted}};
  opacity:0;animation:slide .8s cubic-bezier(.16,1,.3,1) .45s both}
.big b{color:{{ink}};font-weight:700}
.big i{color:{{accent1}};font-style:italic;font-family:'DejaVu Serif',Georgia,serif}
.links{margin-top:40px;font-size:27px;color:{{ink}};border-left:3px solid {{accent1}};
  padding-left:22px;opacity:0;animation:slide .7s ease .62s both}
.foot{margin-top:12px;font-size:21px;color:{{faint}};padding-left:25px;
  opacity:0;animation:slide .7s ease .76s both}
</style></head><body>
<div class="wrap">
  <div class="mark">K</div>
  <div class="kicker">{{name}}</div>
  <h1>{{tagline}}</h1>
  <div class="big">{{headline}}</div>
  <div class="links">{{links}}</div>
  <div class="foot">{{footnote}}</div>
</div>
</body></html>
